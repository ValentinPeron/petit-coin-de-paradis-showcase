<title id="titre">L'Iroise, les goélands et le phare de Kermorvan</title>
<desc id="desc">Illustration de pied de page, piste B « Comptoir » : vagues de la mer d'Iroise, trois goélands en vol, île basse à l'horizon (Molène, Ouessant) et le phare de Kermorvan, tour carrée blanche reliée à la côte par un pont de pierre.</desc>
