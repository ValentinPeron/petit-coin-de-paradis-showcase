@media (prefers-reduced-motion: no-preference) {
  #faisceau { animation: eclat 5s ease-in-out infinite; }
  #vague-1 { animation: houle 9s ease-in-out infinite alternate; }
  #vague-2 { animation: houle 7s ease-in-out infinite alternate-reverse; }
  #goelands use { animation: plane 6s ease-in-out infinite alternate; }
  #goelands g use { animation-delay: -2s; }
  #goelands > use:last-child { animation-delay: -4s; }
}
@keyframes eclat { 0%, 70%, 100% { opacity: .12; } 82% { opacity: .55; } }
@keyframes houle { from { transform: translateY(0); } to { transform: translateY(5px); } }
@keyframes plane { from { transform: translateY(0); } to { transform: translateY(-6px); } }
</style>

