     extrémités et angles arrondis, couleur héritée (currentColor) : le picto prend la couleur du texte.
     Usage HTML : <svg class="picto" aria-hidden="true"><use href="pictos.svg#picto-phare"/></svg>
     Symboles : picto-phare, picto-goeland, picto-vague, picto-barque, picto-bourriche, picto-algue, picto-abeille, picto-coquille,
     plus picto-hermine (plein, ornement : une seule moucheture par écran). -->
