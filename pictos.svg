<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 120" width="864" height="240" role="img" aria-labelledby="t">
<title id="t">Pictogrammes Le Petit Coin de Paradis</title>
<!-- Sprite de pictogrammes, direction artistique 04.
